<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FORD COLTER</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: black;
      color: white;
    }

    /* BACKGROUND VIDEO */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: grayscale(100%) contrast(110%) brightness(60%);
    }

    /* OVERLAY GRID */
    .overlay {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      padding: 40px;
    }

    .brand {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 2px;
      text-align: center;
      opacity: 1;
    }

    .top-left {
      grid-area: 1 / 1;
      align-self: start;
    }

    .top-center {
      grid-area: 1 / 2;
      justify-self: center;
      font-size: 20px;
      opacity: 0.6;
    }

    .top-right {
      grid-area: 1 / 3;
      justify-self: end;
    }

    .bottom-left {
      grid-area: 3 / 1;
      align-self: end;
    }

    .bottom-right {
      grid-area: 3 / 3;
      justify-self: end;
      align-self: end;
    }

    a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      position: relative;
    }

    a::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 1px;
      bottom: -4px;
      left: 0;
      background: white;
      transition: 0.3s;
    }

    a:hover::after {
      width: 100%;
    }

    /* subtle center counter */
    .counter {
      grid-area: 2 / 2;
      justify-self: center;
      align-self: center;
      font-size: 32px;
      opacity: 0.4;
      letter-spacing: 4px;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .overlay {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 20px;
        text-align: center;
      }

      .top-left,
      .top-center,
      .top-right,
      .bottom-left,
      .bottom-right,
      .counter {
        grid-area: auto;
        justify-self: center;
        align-self: center;
      }
    }
  </style>
</head>

<body>

  <!-- 🔥 BACKGROUND VIDEO (replace with your own file) -->
  <video class="bg-video" autoplay muted loop>
    <source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
  </video>

  <!-- OVERLAY CONTENT -->
  <div class="overlay">

    <div class="top-center brand">FORD COLTER</div>

    <div class="top-right">
      <a href="#">GRID</a>
    </div>

    <div class="counter">00:02</div>

    <div class="bottom-left">
      <a href="#">MENU</a>
    </div>

    <div class="bottom-right">
      <a href="#">WORK</a>
    </div>

  </div>

</body>
</html>
