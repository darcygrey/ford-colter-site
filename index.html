<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FORD COLTER</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: black;
      color: white;
    }

    /* BACKGROUND IMAGE */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('images/background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
    }

    /* OVERLAY GRID */
    .overlay {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      padding: 40px;
    }

    .brand {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 2px;
      text-align: center;
      opacity: 1;
    }

    .top-left {
      grid-area: 1 / 1;
      align-self: start;
    }

    .top-center {
      grid-area: 1 / 2;
      justify-self: center;
      font-size: 20px;
      opacity: 0.6;
    }

    .top-right {
      grid-area: 1 / 3;
      justify-self: end;
    }

    .bottom-left {
      grid-area: 3 / 1;
      align-self: end;
    }

    .bottom-right {
      grid-area: 3 / 3;
      justify-self: end;
      align-self: end;
    }

    a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      position: relative;
    }

    a::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 1px;
      bottom: -4px;
      left: 0;
      background: white;
      transition: 0.3s;
    }

    a:hover::after {
      width: 100%;
    }

    /* subtle center dot loader */
    .counter {
      grid-area: 2 / 2;
      justify-self: center;
      align-self: center;
      display: flex;
      gap: 10px;
      opacity: 1;
      margin-top: 12px;
    }

    .counter .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .counter .dot:nth-child(1) { animation-delay: 0s; }
    .counter .dot:nth-child(2) { animation-delay: 0.1s; }
    .counter .dot:nth-child(3) { animation-delay: 0.2s; }
    .counter .dot:nth-child(4) { animation-delay: 0.3s; }
    .counter .dot:nth-child(5) { animation-delay: 0.4s; }
    .counter .dot:nth-child(6) { animation-delay: 0.5s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40% { transform: translateY(-10px); opacity: 1; }
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .overlay {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 20px;
        text-align: center;
      }

      .top-left,
      .top-center,
      .top-right,
      .bottom-left,
      .bottom-right,
      .counter {
        grid-area: auto;
        justify-self: center;
        align-self: center;
      }
    }
  </style>
</head>

<body>

  <!-- 🔥 BACKGROUND IMAGE -->
  <div class="bg-video"></div>

  <!-- OVERLAY CONTENT -->
  <div class="overlay">

    <div class="top-center brand">FORD COLTER</div>

    <div class="top-right">
      <a href="#">GRID</a>
    </div>

    <div class="counter">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="bottom-left">
      <a href="#">MENU</a>
    </div>

    <div class="bottom-right">
      <a href="#">WORK</a>
    </div>

  </div>

</body>
</html>
