<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FORD COLTER</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: black;
      color: white;
    }

    /* BACKGROUND IMAGE */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://chatgpt.com/backend-api/estuary/content?id=file_00000000fc807246b0a095a875c8d80a&ts=492994&p=fs&cid=1&sig=53eb6d746df38cd33b3b7a44699c985f497f19248a3f28dc2f8bf0f4d0f6a899&v=0');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
    }

    /* OVERLAY GRID */
    .overlay {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      padding: 40px;
    }

    .brand {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 2px;
      text-align: center;
      opacity: 1;
    }

    .top-left {
      grid-area: 1 / 1;
      align-self: start;
    }

    .top-center {
      grid-area: 1 / 2;
      justify-self: center;
      font-size: 20px;
      opacity: 0.6;
    }

    .top-right {
      grid-area: 1 / 3;
      justify-self: end;
    }

    .bottom-left {
      grid-area: 3 / 1;
      align-self: end;
    }

    .bottom-right {
      grid-area: 3 / 3;
      justify-self: end;
      align-self: end;
    }

    a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      position: relative;
    }

    a::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 1px;
      bottom: -4px;
      left: 0;
      background: white;
      transition: 0.3s;
    }

    a:hover::after {
      width: 100%;
    }

    /* subtle center loading bar */
    .counter {
      grid-area: 2 / 2;
      justify-self: center;
      align-self: center;
      width: 45%;
      max-width: 450px;
      min-width: 240px;
      opacity: 1;
      margin-top: 12px;
    }

    .counter .bar {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      overflow: hidden;
    }

    .counter .fill {
      width: 0%;
      height: 100%;
      background: rgba(255, 255, 255, 1);
      border-radius: 999px;
      animation: loading 3s linear infinite;
    }

    @keyframes loading {
      0%, 100% { width: 0%; }
      50% { width: 100%; }
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .overlay {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 20px;
        text-align: center;
      }

      .top-left,
      .top-center,
      .top-right,
      .bottom-left,
      .bottom-right,
      .counter {
        grid-area: auto;
        justify-self: center;
        align-self: center;
      }
    }
  </style>
</head>

<body>

  <!-- 🔥 BACKGROUND IMAGE -->
  <div class="bg-video"></div>

  <!-- OVERLAY CONTENT -->
  <div class="overlay">

    <div class="top-center brand">FORD COLTER</div>

    <div class="top-right">
      <a href="#">GRID</a>
    </div>

    <div class="counter">
      <div class="bar">
        <div class="fill"></div>
      </div>
    </div>

    <div class="bottom-left">
      <a href="#">MENU</a>
    </div>

    <div class="bottom-right">
      <a href="#">WORK</a>
    </div>

  </div>

</body>
</html>
